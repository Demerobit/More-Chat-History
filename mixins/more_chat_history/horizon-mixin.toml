[mod]
id = "more_chat_history"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[module]]
id = "runtime"
file = "crates/horizon-client-render/src/chat.rs"
name = "more_chat_history"
source = "runtime.rs"

[[injection]]
id = "stash-message"
target = "horizon_client_render::chat::Chat::add_message"
kind = "HEAD"
helper = "stash.rs"
bindings = [
  { name = "chat", ty = "&mut Chat", value = "self" },
]

[[injection]]
id = "restore-message"
target = "horizon_client_render::chat::Chat::add_message"
kind = "RETURN"
helper = "restore.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "chat", ty = "&mut Chat", value = "self" },
]

[[injection]]
id = "stash-player-message"
target = "horizon_client_render::chat::Chat::add_player_message"
kind = "HEAD"
helper = "stash.rs"
bindings = [
  { name = "chat", ty = "&mut Chat", value = "self" },
]

[[injection]]
id = "restore-player-message"
target = "horizon_client_render::chat::Chat::add_player_message"
kind = "RETURN"
helper = "restore.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "chat", ty = "&mut Chat", value = "self" },
]
